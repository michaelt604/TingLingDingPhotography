<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="p4t p4d">
<title id="p4t">Portraits collection placeholder</title>
<desc id="p4d">Abstract tonal placeholder, to be replaced with a selected photograph.</desc>
<defs>
<linearGradient id="p4a" x1="1" y1="0.5" x2="0" y2="0.5"><stop offset="0" stop-color="#261d19"/><stop offset="0.55" stop-color="#6f4f3d"/><stop offset="1" stop-color="#bb9370"/></linearGradient>
<radialGradient id="p4b" cx="0.2" cy="0.35" r="0.6"><stop offset="0" stop-color="#f4dcb6" stop-opacity="0.55"/><stop offset="0.35" stop-color="#e0b98e" stop-opacity="0.22"/><stop offset="1" stop-color="#d9a878" stop-opacity="0"/></radialGradient>
<radialGradient id="p4c" cx="0.85" cy="0.7" r="0.5"><stop offset="0" stop-color="#1b1411" stop-opacity="0.6"/><stop offset="1" stop-color="#1b1411" stop-opacity="0"/></radialGradient>
<radialGradient id="p4e" cx="0.2" cy="0.35" r=".3"><stop offset="0" stop-color="#fff1d9" stop-opacity="0.2"/><stop offset="1" stop-color="#fff1d9" stop-opacity="0"/></radialGradient>
<radialGradient id="p4v" cx=".5" cy=".5" r=".75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<filter id="p4g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#p4a)"/>
<rect width="1600" height="900" fill="url(#p4c)"/>
<rect width="1600" height="900" fill="url(#p4b)"/>
<rect width="1600" height="900" fill="url(#p4e)"/>
<rect width="1600" height="900" fill="url(#p4v)"/>
<rect width="1600" height="900" filter="url(#p4g)" opacity=".08"/>
</svg>
