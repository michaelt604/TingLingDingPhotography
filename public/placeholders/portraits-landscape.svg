<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="p2t p2d">
<title id="p2t">Portraits collection placeholder</title>
<desc id="p2d">Abstract tonal placeholder, to be replaced with a selected photograph.</desc>
<defs>
<linearGradient id="p2a" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" stop-color="#291f1a"/><stop offset="0.55" stop-color="#7a5642"/><stop offset="1" stop-color="#c9a07a"/></linearGradient>
<radialGradient id="p2b" cx="0.8" cy="0.4" r="0.55"><stop offset="0" stop-color="#f4dcb6" stop-opacity="0.55"/><stop offset="0.35" stop-color="#e0b98e" stop-opacity="0.22"/><stop offset="1" stop-color="#d9a878" stop-opacity="0"/></radialGradient>
<radialGradient id="p2c" cx="0.18" cy="0.6" r="0.45"><stop offset="0" stop-color="#1b1411" stop-opacity="0.6"/><stop offset="1" stop-color="#1b1411" stop-opacity="0"/></radialGradient>
<radialGradient id="p2e" cx="0.8" cy="0.4" r=".3"><stop offset="0" stop-color="#fff1d9" stop-opacity="0.2"/><stop offset="1" stop-color="#fff1d9" stop-opacity="0"/></radialGradient>
<radialGradient id="p2v" cx=".5" cy=".5" r=".75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<filter id="p2g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.35"/></filter>
