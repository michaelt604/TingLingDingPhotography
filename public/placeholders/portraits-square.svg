<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="p1t p1d">
<title id="p1t">Portraits collection placeholder</title>
<desc id="p1d">Abstract tonal placeholder, to be replaced with a selected photograph.</desc>
<defs>
<linearGradient id="p1a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2b211c"/><stop offset="0.55" stop-color="#735140"/><stop offset="1" stop-color="#c29a74"/></linearGradient>
<radialGradient id="p1b" cx="0.74" cy="0.22" r="0.62"><stop offset="0" stop-color="#f4dcb6" stop-opacity="0.55"/><stop offset="0.35" stop-color="#e0b98e" stop-opacity="0.22"/><stop offset="1" stop-color="#d9a878" stop-opacity="0"/></radialGradient>
<radialGradient id="p1c" cx="0.2" cy="0.8" r="0.55"><stop offset="0" stop-color="#1b1411" stop-opacity="0.6"/><stop offset="1" stop-color="#1b1411" stop-opacity="0"/></radialGradient>
<radialGradient id="p1e" cx="0.74" cy="0.22" r=".3"><stop offset="0" stop-color="#fff1d9" stop-opacity="0.2"/><stop offset="1" stop-color="#fff1d9" stop-opacity="0"/></radialGradient>
<radialGradient id="p1v" cx=".5" cy=".5" r=".75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<filter id="p1g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.4 -.35"/></filter>
