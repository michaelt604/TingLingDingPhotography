<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc">
  <title id="title">TingLingDing Photography</title>
  <desc id="desc">A right-facing portrait with flowing purple hair and two manta rays underwater.</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7a7e9" />
      <stop offset="0.55" stop-color="#a478d0" />
      <stop offset="1" stop-color="#6b469b" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2637" />
      <stop offset="1" stop-color="#07111a" />
    </linearGradient>
    <clipPath id="mark-shape">
      <rect width="100" height="100" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#mark-shape)">
    <rect width="100" height="100" fill="url(#sea)" />

    <!-- Flowing hair and the right-facing portrait profile. -->
    <path fill="url(#hair)" d="M58-4c-7 12-2 19-11 28-8 9-3 17 3 24 6 8 3 17-7 29-6 8-8 16-9 27h70V-4Z" />
    <path fill="#fff1df" d="M68 20c8-3 14 0 18 6 2 4 1 8 3 11l4 2c2 1 2 3 0 4l-4 1c1 3 0 5-2 6 1 3-1 5-4 6-2 5-6 8-10 10 0 11 4 23 9 33H52c8-10 9-21 5-31-4-11-3-20 1-30 3-10 5-15 10-18Z" />
    <path d="M80 32c2-1 4-1 6 0M83 47c-2 2-5 2-8 1" fill="none" stroke="#6b469b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lavender ribbons keep the hair legible at favicon size. -->
    <path d="M66-2c-8 12-3 18-12 29-7 9-1 15-9 26-6 8 1 16-6 28-3 5-4 11-4 17" fill="none" stroke="#6b469b" stroke-width="3.2" stroke-linecap="round" opacity=".95" />
    <path d="M70-2c-8 11-2 17-10 27-7 9-2 15-10 26-6 8 1 16-6 29-3 5-4 11-4 17" fill="none" stroke="#dfc8f4" stroke-width="2.3" stroke-linecap="round" opacity=".9" />
    <path d="M59 18c-6 10-1 15-8 25-6 9-1 16-7 26-3 5-4 10-4 16" fill="none" stroke="#8d62be" stroke-width="2.1" stroke-linecap="round" />
    <path d="M80 5c-6 7-3 13-8 20-5 7-3 13-8 20" fill="none" stroke="#b68bdc" stroke-width="1.6" stroke-linecap="round" opacity=".8" />

    <!-- Two manta rays and quiet current lines on the sea side. -->
    <path d="M8 35c8-9 16-10 24-4l3-4 3 4c8-6 16-4 23 4-7 4-12 7-18 9-4-2-8-2-12 0-7-2-14-5-23-9Z" fill="#3eb8af" />
    <path d="M35 44c2 5 2 10 0 15-2-5-2-10 0-15Z" fill="#2b8f91" />
    <path d="M11 72c7-8 15-9 22-4l3-4 3 4c7-5 15-4 21 4-7 4-12 7-18 9-4-2-8-2-12 0-7-2-13-5-19-9Z" fill="#3eb8af" opacity=".94" />
    <path d="M36 80c2 5 2 10 0 14-2-5-2-9 0-14Z" fill="#2b8f91" opacity=".94" />
    <path d="M16 20c-8 10-10 23-7 35 2 9 8 16 17 20" fill="none" stroke="#3eb8af" stroke-width=".8" stroke-linecap="round" opacity=".75" />
    <path d="M21 84c10-4 18-12 22-22 4-10 3-20-2-29" fill="none" stroke="#3eb8af" stroke-width=".8" stroke-linecap="round" opacity=".6" />
    <circle cx="14" cy="22" r="1.2" fill="#79e8e0" opacity=".8" />
    <circle cx="23" cy="56" r="1" fill="#79e8e0" opacity=".7" />
    <circle cx="13" cy="84" r="1.1" fill="#79e8e0" opacity=".6" />
  </g>

  <rect x=".75" y=".75" width="98.5" height="98.5" rx="21.25" fill="none" stroke="#698093" stroke-width="1.5" opacity=".72" />
</svg>
