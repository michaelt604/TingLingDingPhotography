name = "ig-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGIN = "https://tinglingdingphotography.com,https://www.tinglingdingphotography.com"
GRAPH_API_VERSION = "v25.0"

[[kv_namespaces]]
binding = "IG_FEED_CACHE"
id = "4a4fd8b71cb74d348b3c71e08d83b992"

# Required secrets:
#   FB_IG_USER_ID_UNDERWATER (Facebook-scoped IG business account ID)
#   FB_ACCESS_TOKEN_UNDERWATER
#   FB_IG_USER_ID_PORTRAITS (Facebook-scoped IG business account ID)
#   FB_ACCESS_TOKEN_PORTRAITS
#
# Each Page/System User token serves both /media and /collaborative_media for
# its account through graph.facebook.com.

# Production environment — locks CORS to the real site origin so the
# proxy can't be abused from arbitrary origins (which would burn the
# IG rate limit). Override locally with:
#   wrangler dev --var ALLOWED_ORIGIN:http://localhost:3000
